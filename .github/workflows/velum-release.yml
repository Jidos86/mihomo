name: VelumVPN release
# Trimmed-down release build for VelumVPN's own sidecar use: just the platforms/arches the
# Electron app ships (see GOOS_MAP/GOARCH_MAP in VelumVPN's scripts/prepare.mjs and the asset
# naming VelumVPN's downloader expects), built from whichever branch carries the BitTorrent
# sniffer patch (Meta = stable channel, Alpha = prerelease channel).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v1.19.33+velum-bt)'
        required: true
      prerelease:
        description: 'Mark as a GitHub prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            goamd64: v1
            output: mihomo-windows-amd64-v1
            ext: zip
          - goos: windows
            goarch: arm64
            output: mihomo-windows-arm64
            ext: zip
          - goos: darwin
            goarch: amd64
            goamd64: v1
            output: mihomo-darwin-amd64-v1
            ext: gz
          - goos: darwin
            goarch: arm64
            output: mihomo-darwin-arm64
            ext: gz
          - goos: linux
            goarch: amd64
            goamd64: v1
            output: mihomo-linux-amd64-v1
            ext: gz
          - goos: linux
            goarch: arm64
            output: mihomo-linux-arm64
            ext: gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build core
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          go build -tags with_gvisor -trimpath \
            -ldflags "-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=${VERSION}" \
            -o mihomo${{ matrix.goos == 'windows' && '.exe' || '' }} .

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip "${{ matrix.output }}-${VERSION}.zip" mihomo.exe
          else
            gzip -c mihomo > "${{ matrix.output }}-${VERSION}.gz"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            *.zip
            *.gz

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Write version.txt
        run: echo "${{ github.event.inputs.version }}" > bin/version.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: bin/*
