name: VelumVPN release
# Trimmed-down release build for VelumVPN's own sidecar use: just the platforms/arches the
# Electron app ships (see GOOS_MAP/GOARCH_MAP in VelumVPN's scripts/prepare.mjs). Asset names
# carry no version suffix, so the app's downloader can always pull a fixed URL:
#   stable -> https://github.com/<repo>/releases/latest/download/<asset>  (GitHub always
#             resolves "latest" to the newest non-prerelease release)
#   alpha  -> always published to the fixed tag "Prerelease-Alpha" (same convention
#             MetaCubeX's own upstream alpha channel uses), overwriting its assets each run
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to embed in the binary (e.g. v1.19.33+velum-bt)'
        required: true
      channel:
        description: 'Which channel this build is for'
        type: choice
        options: [stable, alpha]
        default: stable

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            goamd64: v1
            output: mihomo-windows-amd64-v1
            ext: zip
          - goos: windows
            goarch: arm64
            output: mihomo-windows-arm64
            ext: zip
          - goos: darwin
            goarch: amd64
            goamd64: v1
            output: mihomo-darwin-amd64-v1
            ext: gz
          - goos: darwin
            goarch: arm64
            output: mihomo-darwin-arm64
            ext: gz
          - goos: linux
            goarch: amd64
            goamd64: v1
            output: mihomo-linux-amd64-v1
            ext: gz
          - goos: linux
            goarch: arm64
            output: mihomo-linux-arm64
            ext: gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build core
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          go build -tags with_gvisor -trimpath \
            -ldflags "-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=${VERSION}" \
            -o mihomo${{ matrix.goos == 'windows' && '.exe' || '' }} .

      - name: Package
        run: |
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip "${{ matrix.output }}.zip" mihomo.exe
          else
            gzip -c mihomo > "${{ matrix.output }}.gz"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            *.zip
            *.gz

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Write version.txt
        run: echo "${{ github.event.inputs.version }}" > bin/version.txt

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event.inputs.channel }}" = "alpha" ]; then
            echo "tag=Prerelease-Alpha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete previous assets on the alpha tag
        if: github.event.inputs.channel == 'alpha'
        run: gh release delete-asset Prerelease-Alpha $(gh release view Prerelease-Alpha --json assets -q '.assets[].name' 2>/dev/null) -y 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          files: bin/*
